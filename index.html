<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; background: #f5f5f5; font-family: 'Georgia', serif;
  }
  .card-container { width: 420px; text-align: center; }
  .card {
    background: #0d3b66; border: 3px solid #c5a55a; border-radius: 12px;
    padding: 30px 25px 20px; color: #fff;
  }
  .logo-row {
    display: flex; align-items: center; justify-content: center;
    gap: 12px; margin-bottom: 15px;
  }
  .logo-row img { width: 65px; height: 65px; object-fit: contain; }

    font-size: 18px; font-weight: bold; color: #c5a55a;
    text-align: left; line-height: 1.2;
  }
  hr { border: none; border-top: 1px solid #c5a55a; margin: 12px 0; }
  .name { font-size: 20px; font-weight: bold; color: #ffffff; margin: 8px 0 4px; }
  .title { font-size: 14px; color: #c5a55a; font-style: italic; margin-bottom: 12px; }
  .details { font-size: 13px; color: #ddd; line-height: 1.8; }
  .details strong { color: #c5a55a; }
  .bottom-row {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 15px; font-size: 11px; color: #aaa;
  }
  .save-btn {
    display: block; margin: 18px auto 0; padding: 12px 30px;
    background: #c5a55a; color: #0d3b66; border: none; border-radius: 8px;
    font-size: 15px; font-weight: bold; cursor: pointer;
    font-family: 'Georgia', serif;
  }
  .save-btn:hover { background: #d4b76a; }
</style>
